kind = "web"
previewPath = "/"
title = "AIGround.com — Premium Domain"
version = "1.0.0"
id = "artifacts/aiground-landing"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23409

[services.development]
run = "pnpm --filter @workspace/aiground-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aiground-landing", "run", "build" ]
serve = "static"
publicDir = "artifacts/aiground-landing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23409"
BASE_PATH = "/"
